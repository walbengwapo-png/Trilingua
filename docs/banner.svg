<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bt">
  <title id="bt">TriLingua banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#16294d"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <circle cx="330" cy="180" r="300" fill="url(#glowB)"/>
  <circle cx="960" cy="500" r="330" fill="url(#glowR)"/>
  <circle cx="1120" cy="150" r="280" fill="url(#glowG)"/>
  <circle cx="180" cy="540" r="260" fill="url(#glowG)"/>

  <g transform="translate(470,66) scale(5)">
    <g>
      <circle cx="32" cy="19" r="14.5" fill="none" stroke="#ffffff" stroke-width="11"/>
      <circle cx="32" cy="19" r="14.5" fill="none" stroke="#3b82f6" stroke-width="8.5"/>
      <circle cx="20.7" cy="38.5" r="14.5" fill="none" stroke="#ffffff" stroke-width="11"/>
      <circle cx="20.7" cy="38.5" r="14.5" fill="none" stroke="#10b981" stroke-width="8.5"/>
      <circle cx="43.3" cy="38.5" r="14.5" fill="none" stroke="#ffffff" stroke-width="11"/>
      <circle cx="43.3" cy="38.5" r="14.5" fill="none" stroke="#f43f5e" stroke-width="8.5"/>
    </g>
    <g transform="rotate(-6 32 32)">
      <rect x="25.5" y="24" width="13" height="16" rx="3" fill="#ffffff"/>
      <rect x="28" y="27.5" width="8" height="2.5" rx="1.25" fill="#3b82f6"/>
      <rect x="28" y="32" width="8" height="2.5" rx="1.25" fill="#cbd5e1"/>
      <rect x="28" y="36.5" width="6" height="2.5" rx="1.25" fill="#cbd5e1"/>
