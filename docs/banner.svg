  <text x="640" y="430" text-anchor="middle" font-family="'Segoe UI', Arial, system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#ffffff">TriLingua</text>
  <text x="640" y="488" text-anchor="middle" font-family="'Segoe UI', Arial, system-ui, sans-serif" font-size="34" font-weight="600" letter-spacing="0.5" fill="#cbd5e1">A Multilingual Document Translation System</text>
  <text x="640" y="538" text-anchor="middle" font-family="'Segoe UI', Arial, system-ui, sans-serif" font-size="34" font-weight="600" letter-spacing="0.5" fill="#cbd5e1">for English, Filipino, and Cebuano</text>

  <g font-family="'Segoe UI', Arial, system-ui, sans-serif" font-size="24" font-weight="600" text-anchor="middle">
    <circle cx="470" cy="588" r="7" fill="#3b82f6"/><text x="495" y="595" fill="#e2e8f0">English</text>
    <circle cx="640" cy="588" r="7" fill="#10b981"/><text x="665" y="595" fill="#e2e8f0">Cebuano</text>
    <circle cx="810" cy="588" r="7" fill="#f43f5e"/><text x="835" y="595" fill="#e2e8f0">Filipino</text>
  </g>
