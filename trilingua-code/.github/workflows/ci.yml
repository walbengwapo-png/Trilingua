name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel (PHPUnit + Pint + Composer audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trilingua-code
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite, dom, fileinfo, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: trilingua-code/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('trilingua-code/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer security audit
        run: composer audit --no-interaction

      - name: Setup Node (for asset build)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trilingua-code/package-lock.json

      - name: Build frontend assets (public/build is gitignored)
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan config:clear

      - name: Run test suite (safe-env guarded)
        run: composer test

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

  frontend:
    name: Frontend (npm audit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trilingua-code
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trilingua-code/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm security audit
        run: npm audit --audit-level=high

      - name: Build production assets
        run: npm run build

  python:
    name: Python microservice tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trilingua-code
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r Model/requirements.txt

      - name: Run pytest
        run: python -m pytest Model/tests -q